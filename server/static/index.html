<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA-Platform · Panel de Monitoreo</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-border: #232f44;
      --text: #e6edf7;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #eab308;
      --danger: #ef4444;
      --surface: #0d131d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--card-border);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.online {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .grid-pcs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .pc-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pc-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .pc-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .viewport {
      position: relative;
      background: #05070b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .viewport img.active {
      display: block;
    }

    .no-signal {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 8px;
    }

    .cam-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      display: none;
    }

    .cam-badge.visible {
      display: block;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      filter: brightness(1.15);
      border-color: #3b4e6e;
    }

    .btn-cam-on {
      background: #143326;
      border-color: #1f5c40;
      color: #86efac;
    }

    .btn-cam-off {
      background: #2b2613;
      border-color: #5c4e19;
      color: #fde047;
    }

    .btn-audio {
      background: #172846;
      border-color: #27477d;
      color: #93c5fd;
    }

    .btn-warn {
      background: #332214;
      border-color: #694121;
      color: #fdba74;
    }

    .btn-danger {
      background: #38161c;
      border-color: #782634;
      color: #fca5a5;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel h2 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .box-log {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      height: 170px;
      overflow-y: auto;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .chat-row {
      display: flex;
      gap: 8px;
    }

    select, input[type="text"] {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    input[type="text"] {
      flex: 1;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>NOVA-Platform · Control Multi-Equipo</span>
    </div>
    <div class="status-pill">
      <span id="server-dot" class="dot"></span>
      <span id="server-status">Conectando al servidor...</span>
    </div>
  </header>

  <main>
    <section id="grid-pcs" class="grid-pcs"></section>

    <section class="bottom-grid">
      <div class="panel">
        <h2>Chat Bidireccional</h2>
        <div id="chat-box" class="box-log"></div>
        <form id="chat-form" class="chat-row">
          <select id="chat-target"></select>
          <input id="chat-input" type="text" placeholder="Escribe un mensaje..." autocomplete="off" />
          <button type="submit" class="btn-primary">Enviar</button>
        </form>
      </div>

      <div class="panel">
        <h2>Actividad del Servidor (Logs en Vivo)</h2>
        <div id="log-box" class="box-log"></div>
      </div>
    </section>
  </main>

  <script>
    const INITIAL_IDS = ["PC-1", "PC-2", "PC-3"];
    const pcsState = {};
    const camActiveMap = {};
    let panelSocket = null;

    const gridEl = document.getElementById("grid-pcs");
    const logBox = document.getElementById("log-box");
    const chatBox = document.getElementById("chat-box");
    const chatTarget = document.getElementById("chat-target");
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const serverDot = document.getElementById("server-dot");
    const serverStatus = document.getElementById("server-status");

    function horaActual() {
      return new Date().toTimeString().slice(0, 8);
    }

    function agregarLog(texto) {
      const div = document.createElement("div");
      div.textContent = `[${horaActual()}] ${texto}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function agregarChat(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function crearTarjetaPC(pcId) {
      if (pcsState[pcId]) return;
      pcsState[pcId] = { online: false };
      camActiveMap[pcId] = false;

      const card = document.createElement("article");
      card.className = "pc-card";
      card.id = `card-${pcId}`;
      card.innerHTML = `
        <div class="pc-header">
          <div>
            <div class="pc-title">${pcId}</div>
            <div class="pc-meta" id="meta-${pcId}">Sin conexión</div>
          </div>
          <span class="dot" id="dot-${pcId}"></span>
        </div>

        <div class="viewport">
          <span class="cam-badge" id="badge-${pcId}">CÁMARA ACTIVA</span>
          <span class="no-signal" id="nosignal-${pcId}">Sin conexión</span>
          <img id="img-${pcId}" alt="Vista de ${pcId}" />
        </div>

        <div class="controls">
          <button class="btn-cam-on" onclick="controlCamara('${pcId}', true)">Prender Cámara</button>
          <button class="btn-cam-off" onclick="controlCamara('${pcId}', false)">Apagar Cámara</button>
          <button class="btn-audio" onclick="enviarAudio('${pcId}')">Reproducir Audio</button>
          <button class="btn-warn" onclick="enviarComando('${pcId}', 'bloquear_input')">Bloquear Periféricos</button>
          <button onclick="enviarComando('${pcId}', 'desbloquear_input')">Desbloquear</button>
          <button onclick="pedirDominioWeb('${pcId}')">Bloquear Web</button>
          <button onclick="enviarComando('${pcId}', 'denegar_ping')">Denegar Ping</button>
          <button onclick="enviarComando('${pcId}', 'permitir_ping')">Permitir Ping</button>
          <button class="btn-danger" style="grid-column: span 2;" onclick="confirmarApagar('${pcId}')">Apagar PC</button>
        </div>
      `;
      gridEl.appendChild(card);

      const opt = document.createElement("option");
      opt.value = pcId;
      opt.textContent = pcId;
      chatTarget.appendChild(opt);
    }

    function marcarConectado(pcId, conectado) {
      crearTarjetaPC(pcId);
      pcsState[pcId].online = conectado;

      const dot = document.getElementById(`dot-${pcId}`);
      const meta = document.getElementById(`meta-${pcId}`);
      const noSignal = document.getElementById(`nosignal-${pcId}`);
      const img = document.getElementById(`img-${pcId}`);
      const badge = document.getElementById(`badge-${pcId}`);

      if (conectado) {
        dot.classList.add("online");
        meta.textContent = "En línea";
        noSignal.style.display = "none";
      } else {
        dot.classList.remove("online");
        meta.textContent = "Sin conexión";
        noSignal.style.display = "block";
        noSignal.textContent = "Sin conexión";
        img.classList.remove("active");
        badge.classList.remove("visible");
      }
    }

    function mostrarFrame(pcId, base64Img, esCamara) {
      marcarConectado(pcId, true);
      if (esCamara && !camActiveMap[pcId]) return;
      if (!esCamara && camActiveMap[pcId]) return;

      const img = document.getElementById(`img-${pcId}`);
      const noSignal = document.getElementById(`nosignal-${pcId}`);
      const badge = document.getElementById(`badge-${pcId}`);

      img.src = `data:image/jpeg;base64,${base64Img}`;
      img.classList.add("active");
      noSignal.style.display = "none";
      badge.classList.toggle("visible", Boolean(esCamara));
    }

    function enviarPayload(payload) {
      if (!panelSocket || panelSocket.readyState !== WebSocket.OPEN) {
        agregarLog("No hay conexión activa con el servidor WebSocket.");
        return;
      }
      panelSocket.send(JSON.stringify(payload));
    }

    function enviarComando(pcId, accion, extra = {}) {
      crearTarjetaPC(pcId);
      enviarPayload({
        destino: pcId,
        pc_id: pcId,
        accion,
        ...extra
      });
      agregarLog(`Orden '${accion}' enviada a ${pcId}`);
    }

    function controlCamara(pcId, encender) {
      crearTarjetaPC(pcId);
      camActiveMap[pcId] = encender;
      const badge = document.getElementById(`badge-${pcId}`);
      if (badge) {
        badge.classList.toggle("visible", encender);
      }
      enviarComando(pcId, encender ? "prender_camara" : "apagar_camara", { estado: encender });
    }

    function enviarAudio(pcId) {
      crearTarjetaPC(pcId);
      enviarComando(pcId, "audio", {
        frecuencia: 880,
        duracion: 0.6,
        texto: `Alerta enviada a ${pcId}`
      });
    }

    function pedirDominioWeb(pcId) {
      const dominio = prompt(`Dominio a bloquear en ${pcId} (ej. ejemplo.com):`);
      if (dominio && dominio.trim()) {
        enviarComando(pcId, "bloquear_web", { dominio: dominio.trim() });
      }
    }

    function confirmarApagar(pcId) {
      if (confirm(`¿Seguro que deseas apagar ${pcId}?`)) {
        enviarComando(pcId, "apagar");
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const pcId = chatTarget.value;
      const mensaje = chatInput.value.trim();
      if (!pcId || !mensaje) return;

      enviarPayload({
        destino: pcId,
        pc_id: pcId,
        accion: "chat",
        mensaje
      });
      agregarChat(`[Admin -> ${pcId}]: ${mensaje}`);
      agregarLog(`Mensaje enviado a ${pcId}`);
      chatInput.value = "";
    });

    function conectarPanel() {
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${proto}//${window.location.host}/ws/panel`;
      panelSocket = new WebSocket(wsUrl);

      panelSocket.onopen = () => {
        serverDot.classList.add("online");
        serverStatus.textContent = "Servidor Activo";
        agregarLog(`Conectado al panel (${wsUrl})`);
      };

      panelSocket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const pcId = data.pc_id || data.origen || data.id;

          if (data.tipo === "estado" && pcId) {
            marcarConectado(pcId, Boolean(data.online));
          } else if (data.tipo === "pantalla" && pcId && data.imagen) {
            mostrarFrame(pcId, data.imagen, false);
          } else if (data.tipo === "camara" && pcId && data.imagen) {
            mostrarFrame(pcId, data.imagen, true);
          } else if (data.tipo === "chat" && pcId && data.mensaje) {
            agregarChat(`[${pcId} -> Admin]: ${data.mensaje}`);
          } else if (data.tipo === "log" && data.mensaje) {
            agregarLog(data.mensaje);
          } else if (pcId) {
            marcarConectado(pcId, true);
          }
        } catch (err) {
          agregarLog(`Mensaje no JSON recibido: ${event.data}`);
        }
      };

      panelSocket.onclose = () => {
        serverDot.classList.remove("online");
        serverStatus.textContent = "Reconectando...";
        agregarLog("Conexión con el panel cerrada. Reintentando en 3s...");
        setTimeout(conectarPanel, 3000);
      };

      panelSocket.onerror = () => {
        serverDot.classList.remove("online");
        serverStatus.textContent = "Error de conexión";
      };
    }

    INITIAL_IDS.forEach(crearTarjetaPC);
    conectarPanel();
  </script>
</body>
</html>
